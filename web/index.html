<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Loot — toys picked for every age, delivered across Kuwait. KNET and cash on delivery.">

  <!-- Open Graph: shared links unfurl with the brand (spec §4.2) -->
  <meta property="og:title" content="Loot — Toys for every age">
  <meta property="og:description" content="Toys picked for every age, delivered across Kuwait. KNET · Cash on delivery.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://getloot.co/">
  <meta property="og:image" content="https://getloot.co/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Loot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Loot — Toys for every age</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Branded splash: shown while the CanvasKit bundle loads (spec §4.2). */
    #loot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #FFF8F0;
      z-index: 9999;
      transition: opacity 300ms ease-out;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #loot-splash .bear {
      font-size: 64px;
      animation: loot-bounce 1.2s ease-in-out infinite;
    }
    #loot-splash .wordmark {
      color: #E8503A;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    #loot-splash .bar {
      width: 160px;
      height: 6px;
      border-radius: 3px;
      background: #EAF4FB;
      overflow: hidden;
    }
    #loot-splash .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: #E8503A;
      animation: loot-slide 1.1s ease-in-out infinite;
    }
    @keyframes loot-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes loot-slide {
      0% { margin-inline-start: -40%; }
      100% { margin-inline-start: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      #loot-splash .bear, #loot-splash .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loot-splash" aria-label="Loading Loot">
    <div class="bear">🧸</div>
    <div class="wordmark">Loot</div>
    <div class="bar"></div>
  </div>

  <script>
    // Remove the splash once the first Flutter frame renders.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loot-splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
