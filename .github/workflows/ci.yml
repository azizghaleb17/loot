name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: RTL lint — ban non-directional geometry
        run: |
          set +e
          MATCHES=$(grep -rnE "EdgeInsets\.only\((left|right)|EdgeInsets\.fromLTRB|Alignment\.(centerLeft|centerRight|topLeft|topRight|bottomLeft|bottomRight)|TextAlign\.(left|right)" lib --include='*.dart')
          if [ -n "$MATCHES" ]; then
            echo "Non-directional geometry found (use EdgeInsetsDirectional / AlignmentDirectional / start|end):"
            echo "$MATCHES"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web (release)
        run: flutter build web --release --dart-define=BACKEND_MODE=demo

      - name: SPA redirects for Cloudflare Pages
        run: cp web/_redirects build/web/_redirects

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare secrets not configured yet — skipping deploy."
            exit 0
          fi
          npx wrangler pages deploy build/web --project-name=getloot
