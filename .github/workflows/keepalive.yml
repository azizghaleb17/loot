# Prevents the Supabase free-tier project from pausing after 7 idle days
# by running one trivial query daily. (Spec risk #1.)
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Supabase secrets not configured yet — skipping."
            exit 0
          fi
          curl -sf "$SUPABASE_URL/rest/v1/age_groups?select=slug&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
